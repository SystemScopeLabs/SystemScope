name: Mutants
# On a pull request, a gate: the mutants of the lines it changes (--in-diff); a missed or
# timed-out one fails the run. On demand, the full sweep of a milestone's exit audit:
# missed and timed-out mutants are reported in the summary, and the run fails only when a
# tool, a baseline, or a runner fails, or when a shard leaves no mutants.out behind for a
# pass.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      shard_count:
        description: Number of shards (every shard of one run uses the same count)
        default: "20"
      shard:
        description: Run only this shard index (0-based); empty runs all shards
        default: ""
permissions:
  contents: read
concurrency:
  group: mutants-${{ github.event.pull_request.number || 'audit' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_TERM_COLOR: always
  # Set on a pull request: mutate only its changes, the merge commit against the base.
  DIFF: ${{ github.event_name == 'pull_request' && 'true' || '' }}
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      run: ${{ steps.decide.outputs.run }}
      shard_count: ${{ steps.decide.outputs.shard_count }}
      shards: ${{ steps.decide.outputs.shards }}
    steps:
      - uses: actions/checkout@v7
        with: { path: systemscope, fetch-depth: 2 }
      - uses: ./systemscope/.github/actions/setup
        if: env.DIFF
        with:
          save-cache: false
      - uses: taiki-e/install-action@v2
        if: env.DIFF
        with: { tool: cargo-mutants }
      - id: decide
        working-directory: systemscope
        env:
          SHARD_COUNT: ${{ inputs.shard_count || '20' }}
          SHARD: ${{ inputs.shard }}
        run: |
          run=true
          if [ -n "$DIFF" ]; then
            git diff HEAD^1 HEAD > "$RUNNER_TEMP/pr.diff"
            n=$( { cargo mutants --list --in-diff "$RUNNER_TEMP/pr.diff" --workspace -e 'runtime/**'
                   cargo mutants --list --in-diff "$RUNNER_TEMP/pr.diff" -p systemscope-runtime
                 } | grep -c . || true)
            echo "$n mutants in the changed lines." >> "$GITHUB_STEP_SUMMARY"
            [ "$n" -gt 0 ] || run=false
            # About 20 mutants a shard, each a build and a test run of a minute or two.
            SHARD_COUNT=$(( n / 20 + 1 ))
            [ "$SHARD_COUNT" -le 10 ] || SHARD_COUNT=10
            SHARD=
          fi
          case "$SHARD_COUNT" in ''|*[!0-9]*|0) echo "::error::shard_count must be a positive integer"; exit 1 ;; esac
          if [ -z "$SHARD" ]; then
            shards=$(jq -cn --argjson n "$SHARD_COUNT" '[range($n)]')
          else
            case "$SHARD" in *[!0-9]*) echo "::error::shard must be an integer"; exit 1 ;; esac
            if [ "$SHARD" -ge "$SHARD_COUNT" ]; then echo "::error::shard must be below shard_count"; exit 1; fi
            shards="[$SHARD]"
          fi
          {
            echo "run=$run"
            echo "shard_count=$SHARD_COUNT"
            echo "shards=$shards"
          } >> "$GITHUB_OUTPUT"

  mutants:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    # The slowest of the 20 shards took 166 minutes (2026-10-24).
    timeout-minutes: 240
    strategy:
      fail-fast: false
      # Leave runner slots for pull request CI.
      max-parallel: 10
      matrix:
        shard: ${{ fromJSON(needs.gate.outputs.shards) }}
    defaults:
      run:
        working-directory: systemscope
    steps:
      - uses: actions/checkout@v7
        with: { path: systemscope, fetch-depth: 2 }
      - uses: ./systemscope/.github/actions/setup
        with:
          save-cache: ${{ strategy.job-index == 0 }}
      - uses: taiki-e/install-action@v2
        with: { tool: "cargo-mutants,cargo-nextest" }
      - name: Run cargo-mutants shard ${{ matrix.shard }}/${{ needs.gate.outputs.shard_count }}
        env:
          SHARD: ${{ matrix.shard }}/${{ needs.gate.outputs.shard_count }}
        run: |
          # Log memory and disk every five minutes: the job log streams live, so it
          # survives a runner that dies before the upload step.
          ( while sleep 300; do
              echo "::group::resources $(date -u +%H:%M:%S)"; free -m; df -h /; echo "::endgroup::"
            done ) &
          monitor=$!
          diff=()
          if [ -n "$DIFF" ]; then
            git diff HEAD^1 HEAD > "$RUNNER_TEMP/pr.diff"
            diff=(--in-diff "$RUNNER_TEMP/pr.diff")
          fi
          # A memory-hungry mutant is killed inside this cgroup instead of taking the
          # whole runner down; the mutant is then recorded as a failed test. OOMPolicy=continue
          # keeps systemd from stopping the whole scope, cargo-mutants included, after that kill.
          # A mutant's tests finish in about 70 s at most, so a 180 s timeout stops a runaway
          # one well before the automatic timeout (about 600 s) would.
          mutants() {
            sudo -E env "PATH=$PATH" "HOME=$HOME" \
              systemd-run --scope --quiet --uid="$(id -u)" --gid="$(id -g)" \
                -p MemoryMax=12G -p MemorySwapMax=0 -p OOMPolicy=continue \
              cargo mutants --in-place --no-shuffle \
                --shard "$SHARD" --sharding round-robin --timeout 180 "${diff[@]}" "$@"
          }
          # 0: all caught; 2: missed mutants; 3: timeouts. Both are findings, shown by
          # the summary job, and fail a pull request. 1 (usage), 4 (baseline failed), and
          # anything else fail.
          failed=0
          check() {
            case "$2" in
              0) echo "cargo-mutants ($1) exited 0" ;;
              2|3) echo "cargo-mutants ($1) exited $2"; [ -z "$DIFF" ] || failed=1 ;;
              *) echo "::error::cargo-mutants ($1) exited $2"; failed=1 ;;
            esac
          }
          # The runtime's snapshot, restore, and trace behavior is tested on real toy
          # components, in the toy crate's tests, so the runtime's mutants run those too.
          # cargo-mutants creates only the last directory of -o.
          mkdir -p out
          status=0
          mutants --workspace -e 'runtime/**' -o out/main || status=$?
          check main "$status"
          status=0
          mutants -p systemscope-runtime \
            --test-package systemscope-runtime --test-package systemscope-toy \
            -o out/runtime || status=$?
          check runtime "$status"
          kill "$monitor"
          free -m; df -h /
          exit "$failed"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutants.out-${{ matrix.shard }}
          path: systemscope/out
          if-no-files-found: ignore

  summary:
    needs: [gate, mutants]
    if: always() && needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: mutants.out-*
          path: shards
      - name: Summarize shards
        env:
          SHARDS: ${{ needs.gate.outputs.shards }}
          SHARD_COUNT: ${{ needs.gate.outputs.shard_count }}
          SHARDS_RESULT: ${{ needs.mutants.result }}
        run: |
          mkdir -p shards
          failed=0
          # On a pull request this job is the one check to require: it fails with any shard.
          if [ -n "$DIFF" ] && [ "$SHARDS_RESULT" != success ]; then
            echo "::error::a shard failed: $SHARDS_RESULT"
            failed=1
          fi
          {
            echo "## Mutants at ${GITHUB_SHA:0:7}, $(jq length <<<"$SHARDS") of $SHARD_COUNT shards"
            echo
            echo "| Shard | Caught | Missed | Timeout | Unviable |"
            echo "|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          # Each shard holds a mutants.out per pass: main/ and runtime/. A pull request's
          # pass with no mutants in its shard writes none.
          count() { cat "$1"/*/mutants.out/"$2".txt 2>/dev/null | grep -c . || true; }
          for k in $(jq -r '.[]' <<<"$SHARDS"); do
            d="shards/mutants.out-$k"
            if [ -z "$DIFF" ] && { [ ! -f "$d/main/mutants.out/outcomes.json" ] \
              || [ ! -f "$d/runtime/mutants.out/outcomes.json" ]; }; then
              echo "::error::shard $k left no mutants.out for a pass"
              echo "| $k | no mutants.out | | | |" >> "$GITHUB_STEP_SUMMARY"
              failed=1
              continue
            fi
            echo "| $k | $(count "$d" caught) | $(count "$d" missed) | $(count "$d" timeout) | $(count "$d" unviable) |" >> "$GITHUB_STEP_SUMMARY"
          done
          total() { cat shards/*/*/mutants.out/"$1".txt 2>/dev/null | grep -c . || true; }
          {
            echo "| **all** | $(total caught) | $(total missed) | $(total timeout) | $(total unviable) |"
            echo
            for kind in missed timeout; do
              echo "<details><summary>$kind</summary>"
              echo
              echo '```'
              cat shards/*/*/mutants.out/"$kind".txt 2>/dev/null | sort
              echo '```'
              echo "</details>"
              echo
            done
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$failed"
