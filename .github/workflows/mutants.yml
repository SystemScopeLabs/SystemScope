name: Mutants
# Weekly and on demand only: exploratory, never a PR gate. Missed and timed-out mutants
# are reported in the summary; the run fails only when a tool, a baseline, or a runner
# fails, or when a shard leaves no mutants.out behind.
on:
  schedule:
    # Saturday 18:17 UTC (Sunday 03:17 KST); off the hour, where scheduled runs queue.
    - cron: "17 18 * * 6"
  workflow_dispatch:
    inputs:
      force:
        description: Run even if nothing mutated changed since the last successful scheduled run
        type: boolean
        default: false
      shard_count:
        description: Number of shards (every shard of one run uses the same count)
        default: "20"
      shard:
        description: Run only this shard index (0-based); empty runs all shards
        default: ""
permissions:
  contents: read
  # The gate reads earlier scheduled runs to skip when nothing mutated changed.
  actions: read
concurrency:
  group: mutants
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
jobs:
  gate:
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.decide.outputs.run }}
      shard_count: ${{ steps.decide.outputs.shard_count }}
      shards: ${{ steps.decide.outputs.shards }}
    steps:
      - uses: actions/checkout@v7
        with: { path: systemscope, fetch-depth: 0 }
      - id: decide
        working-directory: systemscope
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
          SHARD_COUNT: ${{ inputs.shard_count || '20' }}
          SHARD: ${{ inputs.shard }}
          # What the run mutates, and what decides which mutants exist.
          WATCHED: runtime components elf reference Cargo.lock .cargo/mutants.toml
        run: |
          case "$SHARD_COUNT" in ''|*[!0-9]*|0) echo "::error::shard_count must be a positive integer"; exit 1 ;; esac
          if [ -z "$SHARD" ]; then
            shards=$(jq -cn --argjson n "$SHARD_COUNT" '[range($n)]')
          else
            case "$SHARD" in *[!0-9]*) echo "::error::shard must be an integer"; exit 1 ;; esac
            if [ "$SHARD" -ge "$SHARD_COUNT" ]; then echo "::error::shard must be below shard_count"; exit 1; fi
            shards="[$SHARD]"
          fi
          # Skip when nothing watched changed since the last successful scheduled run on
          # this branch. A skipped run counts too: nothing changed before it either.
          run=true
          if [ "$FORCE" != true ]; then
            last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow mutants.yml \
              --branch "$GITHUB_REF_NAME" --event schedule --status success --limit 1 \
              --json headSha --jq '.[0].headSha // empty')
            # shellcheck disable=SC2086 # WATCHED is a list of paths
            if [ -n "$last" ] && git cat-file -e "$last^{commit}" 2>/dev/null \
              && git diff --quiet "$last" HEAD -- $WATCHED; then
              run=false
              echo "Nothing mutated changed since ${last:0:7}, the last successful scheduled run; skipping." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          {
            echo "run=$run"
            echo "shard_count=$SHARD_COUNT"
            echo "shards=$shards"
          } >> "$GITHUB_OUTPUT"

  mutants:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      # Leave runner slots for pull request CI.
      max-parallel: 10
      matrix:
        shard: ${{ fromJSON(needs.gate.outputs.shards) }}
    defaults:
      run:
        working-directory: systemscope
    steps:
      - uses: actions/checkout@v7
        with: { path: systemscope }
      - uses: actions/checkout@v7
        with:
          repository: SystemScopeLabs/contracts
          ref: 90900a128d51f6b42e86dc789447882c90c52ef4
          path: contracts
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: systemscope
          save-if: ${{ strategy.job-index == 0 }}
      - uses: taiki-e/install-action@v2
        with: { tool: "cargo-mutants,cargo-nextest" }
      - name: Run cargo-mutants shard ${{ matrix.shard }}/${{ needs.gate.outputs.shard_count }}
        env:
          SHARD: ${{ matrix.shard }}/${{ needs.gate.outputs.shard_count }}
        run: |
          # Log memory and disk every five minutes: the job log streams live, so it
          # survives a runner that dies before the upload step.
          ( while sleep 300; do
              echo "::group::resources $(date -u +%H:%M:%S)"; free -m; df -h /; echo "::endgroup::"
            done ) &
          monitor=$!
          # A memory-hungry mutant is killed inside this cgroup instead of taking the
          # whole runner down; the mutant is then recorded as a failed test. OOMPolicy=continue
          # keeps systemd from stopping the whole scope, cargo-mutants included, after that kill.
          # A mutant's tests finish in about 70 s at most, so a 180 s timeout stops a runaway
          # one well before the automatic timeout (about 600 s) would.
          status=0
          sudo -E env "PATH=$PATH" "HOME=$HOME" \
            systemd-run --scope --quiet --uid="$(id -u)" --gid="$(id -g)" \
              -p MemoryMax=12G -p MemorySwapMax=0 -p OOMPolicy=continue \
            cargo mutants --workspace --in-place --no-shuffle \
              --shard "$SHARD" --sharding round-robin --timeout 180 || status=$?
          kill "$monitor"
          free -m; df -h /
          # 0: all caught; 2: missed mutants; 3: timeouts. Both are findings, shown by
          # the summary job. 1 (usage), 4 (baseline failed), and anything else fail.
          case "$status" in
            0|2|3) echo "cargo-mutants exited $status" ;;
            *) echo "::error::cargo-mutants exited $status"; exit 1 ;;
          esac
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutants.out-${{ matrix.shard }}
          path: systemscope/mutants.out
          if-no-files-found: ignore

  summary:
    needs: [gate, mutants]
    if: always() && needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: mutants.out-*
          path: shards
      - name: Summarize shards
        env:
          SHARDS: ${{ needs.gate.outputs.shards }}
          SHARD_COUNT: ${{ needs.gate.outputs.shard_count }}
        run: |
          mkdir -p shards
          failed=0
          {
            echo "## Mutants at ${GITHUB_SHA:0:7}, $(jq length <<<"$SHARDS") of $SHARD_COUNT shards"
            echo
            echo "| Shard | Caught | Missed | Timeout | Unviable |"
            echo "|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          count() { if [ -f "$1" ]; then grep -c . "$1" || true; else echo 0; fi; }
          for k in $(jq -r '.[]' <<<"$SHARDS"); do
            d="shards/mutants.out-$k"
            if [ ! -f "$d/outcomes.json" ]; then
              echo "::error::shard $k left no mutants.out"
              echo "| $k | no mutants.out | | | |" >> "$GITHUB_STEP_SUMMARY"
              failed=1
              continue
            fi
            echo "| $k | $(count "$d/caught.txt") | $(count "$d/missed.txt") | $(count "$d/timeout.txt") | $(count "$d/unviable.txt") |" >> "$GITHUB_STEP_SUMMARY"
          done
          total() { cat shards/*/"$1".txt 2>/dev/null | grep -c . || true; }
          {
            echo "| **all** | $(total caught) | $(total missed) | $(total timeout) | $(total unviable) |"
            echo
            for kind in missed timeout; do
              echo "<details><summary>$kind</summary>"
              echo
              echo '```'
              cat shards/*/"$kind".txt 2>/dev/null | sort
              echo '```'
              echo "</details>"
              echo
            done
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$failed"
