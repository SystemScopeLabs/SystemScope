name: Nightly

# One random seed per night, printed so a failure can be reproduced with
# `M0_SEED=<seed> cargo nextest run -p systemscope-acceptance --run-ignored only`.
# It has no golden digests and is never compared with tests/golden (docs/m0-design.md §9.1).
# The same seed, as M1_PROGEN_SEED, picks the night's generated RV32I program
# (docs/m1-design.md §10.3): `M1_PROGEN_SEED=<seed> cargo nextest run -p systemscope-rv32
# --run-ignored only` on both operating systems, and `cargo xtask spike random` on Linux.
# As M4_FAULT_SEED, it draws the night's register fault on m3-reference, which the M4
# locator and the naive oracle must find alike (docs/m4-design.md §30.7).
# As M5_CAMPAIGN_SEED, it is the night's perturbation seed, under which the unpatched
# m5-reference scenario must agree for A, B, and C (docs/m5-design.md §14).
on:
  schedule:
    # Sunday to Friday, and Saturday, which also runs coverage: the coverage report
    # depends only on the commit, so once a week is enough.
    - cron: "0 17 * * 0-5"
    - cron: "0 17 * * 6"
  workflow_dispatch:
    inputs:
      seed:
        description: "Seed to test (decimal or 0x hex); random when empty"
        required: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: systemscope

jobs:
  seed:
    name: pick a seed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      seed: ${{ steps.pick.outputs.seed }}
    defaults:
      run:
        working-directory: .
    steps:
      - id: pick
        env:
          INPUT_SEED: ${{ inputs.seed }}
        run: |
          seed="${INPUT_SEED:-0x$(od -An -N8 -tx8 /dev/urandom | tr -d ' \n')}"
          echo "seed=$seed" >> "$GITHUB_OUTPUT"
          echo "M0_SEED=$seed" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "M1_PROGEN_SEED=$seed" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "M4_FAULT_SEED=$seed" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "M5_CAMPAIGN_SEED=$seed" | tee -a "$GITHUB_STEP_SUMMARY"

  acceptance:
    name: AT-1..AT-3, random seed (${{ matrix.os }})
    needs: seed
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      M0_SEED: ${{ needs.seed.outputs.seed }}
      M1_PROGEN_SEED: ${{ needs.seed.outputs.seed }}
      M4_FAULT_SEED: ${{ needs.seed.outputs.seed }}
      M5_CAMPAIGN_SEED: ${{ needs.seed.outputs.seed }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: systemscope
      - uses: ./systemscope/.github/actions/setup
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Seed
        shell: bash
        run: echo "M0_SEED=$M0_SEED M1_PROGEN_SEED=$M1_PROGEN_SEED M4_FAULT_SEED=$M4_FAULT_SEED M5_CAMPAIGN_SEED=$M5_CAMPAIGN_SEED"
      # AT-1 step 1 (two processes), AT-2, and AT-3 for the random seed, the M4 fault, and
      # the M5 campaign seed. The offline minimization search is not a seeded test.
      - name: Random-seed acceptance
        run: cargo nextest run -p systemscope-acceptance --locked --profile ci --no-fail-fast --run-ignored only -E 'not (binary(m5_minimize) & test(=search))'
      # The generated program for the same seed passes, deterministically.
      - name: Random-seed generated program
        run: cargo nextest run -p systemscope-rv32 --locked --profile ci --no-fail-fast --run-ignored only
      - name: Report the failing seed
        if: failure()
        shell: bash
        run: echo "::error::nightly acceptance failed for M0_SEED=$M0_SEED M1_PROGEN_SEED=$M1_PROGEN_SEED M4_FAULT_SEED=$M4_FAULT_SEED M5_CAMPAIGN_SEED=$M5_CAMPAIGN_SEED"

  # docs/m1-design.md §10.3, M1-A3: the night's generated program against the pinned
  # Spike, built and cached as in ci.yml's spike job and verified before use.
  spike:
    name: M1-A3 Spike differential, random seed (Linux)
    needs: seed
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      M1_PROGEN_SEED: ${{ needs.seed.outputs.seed }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: systemscope
      - uses: ./systemscope/.github/actions/setup
      # Spike's configure requires dtc; the differential runs Spike with --disable-dtb.
      - name: Install dtc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends device-tree-compiler=1.7.0-2build1
      - uses: actions/cache@v6
        id: spike-cache
        with:
          path: ~/spike
          key: spike-${{ runner.os }}-${{ hashFiles('systemscope/tests/rv32/build-spike.sh') }}
      - name: Build the pinned Spike
        if: steps.spike-cache.outputs.cache-hit != 'true'
        run: cargo xtask spike build ~/spike
      # Verifies Spike first, then runs the one program.
      - name: Random-seed retirement differential
        run: cargo xtask spike random ~/spike
      - name: Report the failing seed
        if: failure()
        run: echo "::error::nightly Spike differential failed for M1_PROGEN_SEED=$M1_PROGEN_SEED"
      - name: Keep Spike's logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: spike-logs
          path: systemscope/target/spike-logs
          if-no-files-found: ignore

  # docs/m5-design.md §17: the m5-reference campaigns' schedule and perturbation
  # coverage, 480 runs, must reproduce the committed report byte for byte on both
  # operating systems. It depends only on the commit, so it runs with the weekly coverage.
  m5-campaign-coverage:
    name: M5 campaign coverage reproduces (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 17 * * 6'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          path: systemscope
      - uses: ./systemscope/.github/actions/setup
      - run: cargo xtask m5-coverage verify campaign

  # docs/m5-design.md §19: every-event resume on m5-reference perturbed by each mechanism's
  # seed 0, where the latencies, the jitter, and the tie state are part of each checkpoint.
  # It depends only on the commit, so it runs weekly; each takes a few minutes.
  m5-perturbed-every-event:
    name: M5 every-event resume, perturbed (${{ matrix.mechanism }})
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 17 * * 6'
    strategy:
      fail-fast: false
      matrix:
        mechanism: [a, b, c]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          path: systemscope
      - uses: ./systemscope/.github/actions/setup
      - run: cargo run --release --locked -p xtask -- m5-golden every-event perturbed ${{ matrix.mechanism }}

  # Wall-clock throughput of the reference workloads (`cargo xtask bench`), for trends
  # only: runner speed varies, so it never fails on a number.
  bench:
    name: bench (report only)
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 17 * * 6'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          path: systemscope
      - uses: ./systemscope/.github/actions/setup
      - name: Throughput
        run: cargo run --release --locked -p xtask -- bench | tee -a "$GITHUB_STEP_SUMMARY"

  coverage:
    name: coverage (report only)
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 17 * * 6'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          path: systemscope
      - uses: ./systemscope/.github/actions/setup
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - run: cargo llvm-cov nextest --workspace --locked --profile ci --no-fail-fast --lcov --output-path lcov.info
      - name: Summary
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cargo llvm-cov report --summary-only >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: lcov
          path: systemscope/lcov.info
